<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IHG 點位後台</title>
    <link rel="stylesheet" href="./admin.css?v=20260501-1" />
  </head>
  <body>
    <main class="wrap">
      <header class="head">
        <div>
          <h1>IHG 點位後台</h1>
          <p>新增或修改點位後，系統會自動重建前台資料檔（ihg_poi.data.js / ihg_poi.json）。</p>
        </div>
        <div class="head-actions">
          <button id="reload-btn" type="button">重新整理清單</button>
          <button id="rebuild-btn" type="button">手動重建前台資料</button>
          <button id="sync-weekly-btn" type="button">同步每週營業時間</button>
          <button id="fill-missing-hours-btn" type="button">補齊今日營業時間</button>
          <button id="fill-missing-names-btn" type="button">補齊英日名稱</button>
          <a class="link-btn" href="../index.html" target="_blank" rel="noreferrer">開啟前台</a>
        </div>
      </header>

      <section class="card">
        <h2>Google Maps API 金鑰</h2>
        <p>直接貼上並儲存在此瀏覽器，之後可用「抓今日」與「補齊今日營業時間」。</p>
        <div class="api-key-row">
          <input id="gmaps-api-key" type="password" autocomplete="off" placeholder="請貼上 Google Maps API Key（AIza...）" />
          <button id="save-api-key-btn" type="button">儲存金鑰</button>
          <button id="test-api-key-btn" type="button">測試金鑰</button>
          <button id="clear-api-key-btn" type="button">清除金鑰</button>
        </div>
        <p id="api-key-hint" class="api-key-hint">尚未設定金鑰</p>
      </section>

      <section class="card">
        <h2>新增點位</h2>
        <form id="place-form" class="grid">
          <label>
            清單名稱
            <input id="list-name" name="list_name" value="大巨蛋" />
          </label>
          <label>
            點位名稱（必填）
            <input id="name" name="name" required />
          </label>
          <label>
            英文名稱（可選）
            <input id="name-en" name="name_en" placeholder="Google Maps English name" />
          </label>
          <label>
            日文名稱（可選）
            <input id="name-ja" name="name_ja" placeholder="Google Maps Japanese name" />
          </label>
          <label class="full">
            地址
            <input id="address" name="address" placeholder="例如：台北市信義區..." />
          </label>
          <label>
            緯度 lat
            <input id="lat" name="lat" placeholder="25.04123" />
          </label>
          <label>
            經度 lng
            <input id="lng" name="lng" placeholder="121.55999" />
          </label>
          <label class="full">
            Google Maps 連結（可選）
            <input id="maps-url" name="maps_url" placeholder="https://maps.app.goo.gl/..." />
          </label>
          <label>
            主分類（可選）
            <select id="primary-category" name="primary_category">
              <option value="">請選擇主分類</option>
              <option value="餐飲">餐飲</option>
              <option value="景點">景點</option>
              <option value="交通">交通</option>
              <option value="商店">商店</option>
              <option value="其他設施">其他設施</option>
            </select>
          </label>
          <label>
            子分類（可複選）
            <div class="check-dropdown js-subcategory-dropdown" data-placeholder="Select subcategories"></div>
            <select id="subcategory" name="subcategory" class="native-multi-select" multiple size="6">
              <option value="" disabled>請先選主分類</option>
            </select>
            <small class="field-hint">Subcategory supports multi-select via dropdown</small>
          </label>
          <label class="full">
            舊版分類欄位（可選）
            <input id="category" name="category" placeholder="舊版分類欄位，可留空" />
          </label>
          <label>
            電話（可選）
            <input id="phone" name="phone" />
          </label>
          <label>
            營業時間（可選）
            <input id="opening-hours" name="opening_hours" placeholder="例如：11:00-21:00 或 週一至週日 11:00-21:00" />
          </label>
          <div class="full">
            <span class="field-title">基本介紹（手寫三語，可選）</span>
            <div class="notes-editor js-notes-editor" data-default-lang="zh">
              <div class="notes-editor__tabs">
                <button type="button" class="notes-tab js-notes-tab" data-lang="zh">中文</button>
                <button type="button" class="notes-tab js-notes-tab" data-lang="en">English</button>
                <button type="button" class="notes-tab js-notes-tab" data-lang="ja">日本語</button>
              </div>
              <div class="notes-editor__panes">
                <label class="notes-pane js-notes-pane" data-lang="zh">
                  中文介紹
                  <textarea id="notes-zh" name="notes_zh" rows="3"></textarea>
                </label>
                <label class="notes-pane js-notes-pane" data-lang="en">
                  English Intro
                  <textarea id="notes-en" name="notes_en" rows="3"></textarea>
                </label>
                <label class="notes-pane js-notes-pane" data-lang="ja">
                  日本語紹介
                  <textarea id="notes-ja" name="notes_ja" rows="3"></textarea>
                </label>
              </div>
            </div>
          </div>
          <div class="full actions">
            <button type="submit">新增點位</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="row">
          <h2>目前點位</h2>
          <p id="count-text">讀取中...</p>
        </div>
        <p>每筆資料分兩排編輯：上排中文名/英名/日名/地址/電話/主分類/子分類/營業時間；下排座標/Google Maps 連結/三語介紹，再按「修改」即可。</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>點位資料（兩排編輯）</th>
              </tr>
            </thead>
            <tbody id="place-body"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>訊息</h2>
        <pre id="log" class="log"></pre>
      </section>
    </main>

    <script src="../google-maps-config.js?v=20260425-4"></script>
    <script>
      window.ADMIN_API_ORIGIN = "https://ihg-admin-api.spider10632.workers.dev";
    </script>
    <script src="./admin.js?v=20260501-2"></script>
  </body>
</html>
